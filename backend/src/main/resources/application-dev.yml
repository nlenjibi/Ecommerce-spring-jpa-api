spring:
  application:
    name: e-store

  datasource:
    url: ${DATABASE_URL}
    username: ${USER_NAME}
    password: ${PASSWORD}
    driver-class-name: ${DATABASE_DRIVER}
    hikari:
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m,recordStats

  graphql:
    # Enable GraphiQL UI
    graphiql:
      enabled: true
      path: /graphiql

    # GraphQL endpoint
    path: /graphql

    # Schema location - THIS IS CRITICAL
    schema:
      locations: classpath:graphql/**/*.graphqls
      file-extensions: .graphqls
      printer:
        enabled: true

    # Enable introspection for GraphiQL
    schema-introspection:
      enabled: true

  thymeleaf:
    check-template-location: false

# Custom cache properties
cache:
  default-ttl: 30  # minutes
  product-ttl: 15   # minutes
  category-ttl: 60 # minutes
  user-ttl: 30     # minutes
  max-size: 1000     # entries

logging:
  level:
    root: INFO
    com.smart_ecomernce_api: DEBUG
    org.hibernate.tool.schema: ERROR
    org.springframework.graphql: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cache: DEBUG
    com.github.benmanes.caffeine: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 9190
  servlet:
    context-path: /api
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha

# Management endpoints for cache monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,cache
  endpoint:
    health:
      show-details: always
    caches:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true
